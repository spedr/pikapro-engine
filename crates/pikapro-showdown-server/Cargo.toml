[package]
name = "pikapro-showdown-server"
description = "A Pokémon Showdown-compatible websocket server on pikapro, for poke-env and other Showdown clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "pikapro-showdown-server"
path = "src/main.rs"

[dependencies]
pikapro.workspace = true
pikapro-data.workspace = true
pikapro-protocol.workspace = true
pikapro-validate.workspace = true
pikapro-server.workspace = true
# The async stack: one runtime, a websocket implementation on top of it,
# and `StreamExt` / `SinkExt` to drive the socket halves.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
# tests/format_tables.rs: every table of format ids, side by side.
pikapro-conformance = { path = "../pikapro-conformance" }
pikapro-teams.workspace = true

[lints]
workspace = true
